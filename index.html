/* =========================================================
   ROOT
========================================================= */

:root {
    --bg: #fbfaf7;
    --surface: #f1efea;
    --text: #222222;
    --muted: #77736d;
    --line: #dedbd5;
    --placeholder: #e8e5df;
    --max-width: 1440px;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    font-weight: 400;
    line-height: 1.6;
}

body.menu-open,
body.modal-open {
    overflow: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}


/* =========================================================
   GLOBAL IMAGE SYSTEM
========================================================= */

.img-container {
    width: 100%;
    background: transparent;
    overflow: hidden;
    position: relative;
}

img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition:
        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.4s ease;
}


/* =========================================================
   HEADER
========================================================= */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 76px;

    background: rgba(251, 250, 247, 0.95);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    border-bottom: 1px solid rgba(0, 0, 0, 0.05);

    z-index: 1000;
}

.header-inner {
    max-width: var(--max-width);
    height: 100%;
    margin: 0 auto;
    padding: 0 42px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 17px;
    letter-spacing: 0.18em;
    font-weight: 500;
    text-transform: uppercase;
}

.desktop-nav {
    display: flex;
    gap: 30px;
}

.desktop-nav a {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #44413d;
    text-transform: uppercase;
    transition: opacity 0.2s ease;
}

.desktop-nav a:hover {
    opacity: 0.5;
}


/* =========================================================
   MOBILE MENU
========================================================= */

.menu-button {
    display: none;

    width: 42px;
    height: 42px;

    border: none;
    background: transparent;

    cursor: pointer;

    align-items: center;
    justify-content: center;

    padding: 0;
}

.menu-icon {
    width: 20px;
    height: 14px;
    position: relative;
}

.menu-icon span {
    position: absolute;
    left: 0;

    width: 20px;
    height: 1px;

    background: var(--text);

    transition:
        transform 0.25s ease,
        top 0.25s ease;
}

.menu-icon span:first-child {
    top: 2px;
}

.menu-icon span:last-child {
    top: 10px;
}

.mobile-menu {
    position: fixed;

    top: 68px;
    left: 0;

    width: 100%;
    height: calc(100vh - 68px);

    background: var(--bg);

    z-index: 999;

    display: none;

    padding: 40px 24px;
}

.mobile-menu.open {
    display: block;
}

.mobile-nav {
    display: flex;
    flex-direction: column;
}

.mobile-nav a {
    font-size: 22px;
    font-weight: 400;

    padding: 16px 0;

    border-bottom: 1px solid var(--line);

    letter-spacing: -0.01em;
}


/* =========================================================
   GENERAL SECTIONS
========================================================= */

section {
    max-width: var(--max-width);

    margin: 0 auto;

    padding: 130px 42px;
}

.section-label {
    font-size: 11px;

    letter-spacing: 0.15em;

    text-transform: uppercase;

    color: var(--muted);

    margin-bottom: 40px;
}

.section-title {
    font-size: 34px;

    font-weight: 400;

    letter-spacing: -0.02em;

    margin-bottom: 60px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    max-width: var(--max-width);

    margin: 0 auto;

    padding: 120px 42px 90px;
}

.hero-image {
    aspect-ratio: 16 / 9;

    cursor: pointer;
}

.hero-image img:hover {
    transform: scale(1.015);
}

.hero-caption {
    display: flex;

    justify-content: space-between;

    gap: 40px;

    padding-top: 18px;

    font-size: 12px;

    color: var(--muted);
}

.hero-caption-left {
    color: var(--text);
}

.hero-intro {
    max-width: 900px;

    padding: 86px 0 16px;

    font-size: clamp(30px, 4vw, 54px);

    line-height: 1.16;

    letter-spacing: -0.035em;

    font-weight: 400;
}

.hero-subline {
    max-width: 700px;

    margin-top: 22px;

    font-size: 15px;

    line-height: 1.7;

    color: var(--muted);

    letter-spacing: 0;
}


/* =========================================================
   INTRO / PRACTICE
========================================================= */

.intro {
    border-top: 1px solid var(--line);
}

.intro-text {
    max-width: 820px;

    font-size: 19px;

    line-height: 1.7;
}

.intro-lead {
    max-width: 760px;

    font-size: 24px;

    line-height: 1.5;

    letter-spacing: -0.015em;

    margin-bottom: 28px;
}


/* =========================================================
   WORKS (消除外层灰框，纯净融合背景)
========================================================= */

.works-grid {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 90px 32px;
}

.work-item {
    cursor: pointer;
}

.work-image {
    aspect-ratio: 4 / 5;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
}

.work-image img {
    object-fit: contain;
    padding: 0;
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
}

.work-item:hover .work-image img {
    transform: scale(1.015);
    opacity: 0.96;
}

.work-info {
    padding-top: 15px;

    display: flex;

    justify-content: space-between;

    gap: 20px;
}

.work-title {
    font-size: 13px;

    font-weight: 500;
}

.work-meta {
    font-size: 12px;

    color: var(--muted);

    text-align: right;

    line-height: 1.5;
}


/* =========================================================
   SERIES
========================================================= */

.series-list {
    border-top: 1px solid var(--line);
}

.series-item {
    border-bottom: 1px solid var(--line);

    padding: 40px 0;

    display: grid;

    grid-template-columns:
        60px
        1.2fr
        240px
        1fr;

    gap: 40px;

    align-items: center;
}

.series-number {
    font-size: 11px;

    color: var(--muted);
}

.series-name {
    font-size: 26px;

    font-weight: 400;
}

.series-image {
    aspect-ratio: 4 / 3;

    cursor: pointer;

    background: transparent;
}

.series-image img {
    object-fit: contain;

    padding: 0;
}

.series-image img:hover {
    transform: scale(1.025);
}

.series-description {
    font-size: 13px;

    color: var(--muted);

    line-height: 1.7;
}


/* =========================================================
   STUDIO
========================================================= */

.studio-section {
    border-top: 1px solid var(--line);
}

.studio-grid {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 32px;
}

.studio-item {
    cursor: pointer;
}

.studio-item .img-container {
    aspect-ratio: 4 / 3;
    background: transparent;
}

.studio-item img:hover {
    transform: scale(1.02);
}

.studio-caption {
    font-size: 12px;

    color: var(--muted);

    margin-top: 10px;
}


/* =========================================================
   ABOUT
========================================================= */

.about-layout,
.statement-layout,
.contact-layout {
    display: grid;

    grid-template-columns: 1fr 1.5fr;

    gap: 100px;
}

.about-left {
    font-size: 13px;

    color: var(--muted);
}

.about-name {
    color: var(--text);

    font-size: 18px;

    margin-bottom: 12px;
}

.about-right p,
.statement-text p {
    font-size: 18px;

    line-height: 1.75;

    margin-bottom: 28px;
}


/* =========================================================
   ARTIST STATEMENT
========================================================= */

.statement {
    border-top: 1px solid var(--line);
}


/* =========================================================
   CV
========================================================= */

.cv-entry {
    margin-bottom: 45px;
}

.cv-year {
    font-size: 12px;

    color: var(--muted);

    margin-bottom: 6px;
}

.cv-title {
    font-size: 18px;

    line-height: 1.45;

    margin-bottom: 4px;
}

.cv-place {
    font-size: 14px;

    color: var(--muted);

    line-height: 1.7;
}

.cv-note {
    font-size: 12px;

    color: var(--muted);

    margin-top: 4px;
}


/* =========================================================
   CONTACT
========================================================= */

.contact {
    border-top: 1px solid var(--line);

    padding-bottom: 150px;
}

.contact-email {
    font-size: 30px;

    letter-spacing: -0.02em;

    display: inline-block;

    margin-bottom: 30px;
}

.contact-note {
    max-width: 550px;

    font-size: 15px;

    color: var(--muted);

    line-height: 1.7;
}

   IMAGE MODAL (LIGHTBOX WITH MULTI-VIEW SWITCHER)

    position: fixed;

    justify-content: center;
}
